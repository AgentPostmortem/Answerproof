[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "answerproof"
version = "0.1.0"
description = "Verifiable, tamper-evident receipts for RAG and agent answers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "royalpinto007", email = "royalpinto007@gmail.com" }]
keywords = ["rag", "audit", "provenance", "merkle", "ed25519", "llm", "trust"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "pydantic>=2.5",
    "cryptography>=41.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "fastapi>=0.110",
    "httpx>=0.27",
]

[project.scripts]
answerproof = "answerproof.cli:main"

[project.urls]
Homepage = "https://github.com/AgentPostmortem/answerproof"
Repository = "https://github.com/AgentPostmortem/answerproof"

[tool.hatch.build.targets.wheel]
packages = ["src/answerproof"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
